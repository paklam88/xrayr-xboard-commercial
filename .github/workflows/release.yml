name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: Download module dependencies
        run: go mod download

      - name: Build Linux amd64 / arm64 static binaries
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist/linux-64 dist/linux-arm64

          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" \
            -o dist/linux-64/XrayR .

          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o dist/linux-arm64/XrayR .

      - name: Fetch geoip.dat / geosite.dat and package archives
        run: |
          set -euo pipefail

          download_dat() {
            local url="$1"
            local out="$2"
            echo "Downloading ${url}"
            curl -fsSL "${url}" -o "${out}"
            local expect
            expect="$(curl -fsSL "${url}.sha256sum" | awk '{print $1}')"
            local actual
            actual="$(sha256sum "${out}" | awk '{print $1}')"
            if [[ "${expect}" != "${actual}" ]]; then
              echo "HASH mismatch for ${out}: expect=${expect} actual=${actual}" >&2
              exit 1
            fi
          }

          download_dat \
            "https://raw.githubusercontent.com/v2fly/geoip/release/geoip.dat" \
            "geoip.dat"
          download_dat \
            "https://raw.githubusercontent.com/v2fly/domain-list-community/release/dlc.dat" \
            "geosite.dat"

          for arch in linux-64 linux-arm64; do
            cp geoip.dat geosite.dat "dist/${arch}/"
            if [[ -f LICENSE ]]; then
              cp LICENSE "dist/${arch}/"
            fi
            if [[ -f release/config/config.yml.example ]]; then
              cp release/config/config.yml.example "dist/${arch}/config.yml.example"
            fi
            tar -C "dist/${arch}" -czf "XrayR-${arch}.tar.gz" .
          done

          ls -lh XrayR-linux-64.tar.gz XrayR-linux-arm64.tar.gz

      - name: Resolve release tag
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=Continuous build (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          generate_release_notes: true
          files: |
            XrayR-linux-64.tar.gz
            XrayR-linux-arm64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
